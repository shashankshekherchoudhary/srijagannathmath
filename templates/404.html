{% extends 'base.html' %}

{% block title %}Page Not Found (404) — Sri Jagannath Math{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center py-5">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg p-5 rounded-4 bg-white">
                <div class="display-1 mb-3" style="color: #FF6B00; font-family: var(--font-heading);">
                    <span style="font-size: 3.5rem;">ॐ</span><br>404
                </div>
                <h2 class="fw-bold mb-3" style="color: #2C1810; font-family: var(--font-heading);">Page Not Found</h2>
                <hr class="w-25 mx-auto mb-4" style="border-top: 3px solid #DAA520;">
                <p class="lead text-muted mb-4">
                    The sacred page or resource you are looking for does not exist or has been relocated.
                </p>
                <div class="d-flex flex-column flex-sm-row justify-content-center gap-3">
                    <a href="{% url 'home' %}" class="btn btn-saffron px-4 py-2">
                        <i class="bi bi-house-door-fill me-2"></i>Return to Home
                    </a>
                    <a href="{% url 'contact' %}" class="btn btn-outline-dark px-4 py-2">
                        <i class="bi bi-envelope-fill me-2"></i>Contact Us
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
